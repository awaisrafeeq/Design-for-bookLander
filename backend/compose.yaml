x-provider-environment: &provider-environment
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
  ZERNIO_API_KEY: ${ZERNIO_API_KEY:-}
  ZERNIO_PROFILE_ID: ${ZERNIO_PROFILE_ID:-}
  ZERNIO_WEBHOOK_SECRET: ${ZERNIO_WEBHOOK_SECRET:-}
  PREDIS_API_KEY: ${PREDIS_API_KEY:-}
  PREDIS_BRAND_ID: ${PREDIS_BRAND_ID:-}
  CREATIFY_API_ID: ${CREATIFY_API_ID:-}
  CREATIFY_API_KEY: ${CREATIFY_API_KEY:-}
  CREATIFY_TTS_ACCENT: ${CREATIFY_TTS_ACCENT:-}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://booklender.tech}
  MEDIA_ROOT: /data/media
  MEDIA_SIGNING_KEY: ${MEDIA_SIGNING_KEY:-}
  MEDIA_MAX_UPLOAD_MB: ${MEDIA_MAX_UPLOAD_MB:-100}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_SECURITY: ${SMTP_SECURITY:-starttls}

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  api:
    build: .
    environment:
      <<: *provider-environment
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-BookLender Studio API}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      REDIS_URL: redis://redis:6379/0
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-bl_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      AUTH_LOGIN_MAX_ATTEMPTS: ${AUTH_LOGIN_MAX_ATTEMPTS:-10}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-900}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS}'
      BOOKLENDER_TIMEZONE: ${BOOKLENDER_TIMEZONE:-America/New_York}
      AI_DAILY_SPEND_CAP_USD: ${AI_DAILY_SPEND_CAP_USD:-5}
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed_team && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    volumes:
      - media_data:/data/media
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - hostinger_postgresql
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      BOOKLENDER_API_URL: http://api:8000/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    environment:
      BOOKLENDER_CADDY_ADDRESS: ${BOOKLENDER_CADDY_ADDRESS:?Set BOOKLENDER_CADDY_ADDRESS in backend/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    environment:
      <<: *provider-environment
      APP_ENV: ${APP_ENV:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      REDIS_URL: redis://redis:6379/0
      BOOKLENDER_TIMEZONE: ${BOOKLENDER_TIMEZONE:-America/New_York}
    command: ["celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO"]
    volumes:
      - media_data:/data/media
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - hostinger_postgresql
    restart: unless-stopped

  scheduler:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      REDIS_URL: redis://redis:6379/0
      BOOKLENDER_TIMEZONE: ${BOOKLENDER_TIMEZONE:-America/New_York}
    command: ["celery", "-A", "app.worker:celery_app", "beat", "--loglevel=INFO"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - hostinger_postgresql
    restart: unless-stopped

  bootstrap:
    build: .
    profiles: ["setup"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      REDIS_URL: redis://redis:6379/0
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOKLENDER_TIMEZONE: ${BOOKLENDER_TIMEZONE:-America/New_York}
      AI_DAILY_SPEND_CAP_USD: ${AI_DAILY_SPEND_CAP_USD:-5}
    command: ["python", "-m", "app.bootstrap"]
    depends_on:
      - api
    networks:
      - default
      - hostinger_postgresql

volumes:
  media_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  hostinger_postgresql:
    name: postgresql-oao5_default
    external: true
